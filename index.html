<!DOCTYPE html>
<html lang="ru">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>FitRPG DOOM Edition</title>

  <!-- Telegram WebApp SDK -->
  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <!-- MediaPipe Pose JS -->
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/camera_utils/camera_utils.js" crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/@mediapipe/pose/pose.js" crossorigin="anonymous"></script>

  <link rel="stylesheet" href="style.css">
</head>
<body>

  <!-- Screen 1: Onboarding -->
  <div id="screen-onboarding" class="screen active">
    <h1 class="doom-title">🔥 DOOM FIT: 30 LEVELS</h1>
    <p class="subtitle">Уничтожай монстров отжиманиями и приседаниями</p>

    <form id="health-form">
      <div class="form-group">
        <label>Уровень подготовки:</label>
        <select id="fitness-level">
          <option value="beginner">Новичок</option>
          <option value="medium">Средний</option>
          <option value="pro">Атлет</option>
        </select>
      </div>

      <div class="form-group">
        <label>Здоровье:</label>
        <select id="health-issues">
          <option value="none">Без ограничений</option>
          <option value="knees">Проблемы с коленями</option>
          <option value="wrists">Проблемы с суставами</option>
        </select>
      </div>

      <button type="submit" class="btn-primary doom-btn">ВОЙТИ В АД 🚀</button>
    </form>
  </div>

  <!-- Screen 2: Game Arena -->
  <div id="screen-game" class="screen">
    
    <div id="tab-arena" class="tab-content active">
      
      <!-- Панель статуса Игрока и Врага (HUD DOOM Style) -->
      <div class="hud-panel">
        <div class="hud-box">
          <span class="hud-label">ИГРОК HP</span>
          <div class="hp-bar player-hp">
            <div id="player-hp-fill" class="hp-fill" style="width: 100%;"></div>
            <span id="player-hp-text">100 / 100</span>
          </div>
        </div>

        <div class="hud-box">
          <span id="player-gold" class="gold-text">🪙 0</span> | 
          <span id="player-lvl">LVL 1/30</span>
        </div>

        <div class="hud-box">
          <span class="hud-label" id="monster-name">СЛИЗЕНЬ HP</span>
          <div class="hp-bar enemy-hp">
            <div id="hp-fill" class="hp-fill" style="width: 100%;"></div>
            <span id="hp-text">10 / 10</span>
          </div>
        </div>
      </div>

      <!-- Увеличенная DOOM-Арена (Монстр overlay поверх видео) -->
      <div id="arena-bg" class="arena-bg chapter-1">
        <div class="chapter-title" id="chapter-title">Глава I: Лесной Рубеж</div>
        
        <!-- Красная вспышка при получении урона игроком -->
        <div id="screen-damage-flash" class="damage-flash"></div>

        <!-- 2D Ретро-Монстр DOOM -->
        <div class="doom-monster-container">
          <div id="monster-sprite" class="doom-sprite">🟢</div>
          <div id="damage-popup-container"></div>
        </div>

        <!-- КРУПНАЯ КАМЕРА С ОТРЕДАКТИРОВАННЫМ СКЕЛЕТОМ И УГЛОМ -->
        <div class="camera-container">
          <video id="webcam" style="display:none;" playsinline></video>
          <canvas id="canvas"></canvas>
        </div>
      </div>

      <!-- Выбор оружия / Упражнения -->
      <div class="exercise-selector">
        <button id="btn-pushup" class="btn-ex active" onclick="switchExercise('pushup')">
          💪 Отжимания (<span id="dmg-pushup-val">1</span> DMG)
        </button>
        <button id="btn-squat" class="btn-ex" onclick="switchExercise('squat')">
          🦵 Приседания (<span id="dmg-squat-val">1</span> DMG)
        </button>
      </div>

      <div class="stats-panel">
        <div>Повторы: <strong id="rep-count">💪 0 | 🦵 0</strong></div>
        <div>Текущий угол: <strong id="angle-display" style="color:#00ff00;">---°</strong></div>
      </div>
    </div>

    <!-- Магазин -->
    <div id="tab-shop" class="tab-content">
      <h2>🛒 Магазин Экипировки</h2>
      <p>Баланс: <strong id="shop-gold" class="gold-text">0 🪙</strong></p>
      <h3>💪 Оружие (Отжимания)</h3>
      <div id="weapons-list" class="shop-list"></div>
      <h3 style="margin-top: 15px;">🦵 Броня/Поножи (Приседания)</h3>
      <div id="boots-list" class="shop-list"></div>
    </div>

    <!-- Нижнее Меню -->
    <div class="bottom-nav">
      <button onclick="showTab('arena')" id="nav-arena" class="nav-btn active">⚔️ БОЙ</button>
      <button onclick="showTab('shop')" id="nav-shop" class="nav-btn">🛒 МАГАЗИН</button>
    </div>

  </div>

  <script src="app.js"></script>
  <script src="pose.js"></script>
</body>
</html>
